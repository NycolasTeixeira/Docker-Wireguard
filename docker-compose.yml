
services:

  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard

    cap_add:
      - NET_ADMIN
      - SYS_MODULE

    environment:
      - PUID=0
      - PGID=0
      - TZ=America/Sao_Paulo

      # Troque pelo seu IP público ou domínio
      - SERVERURL=SEU_IP

      - SERVERPORT=51820

      # Quantidade inicial de peers
      - PEERS=2

      - PEERDNS=1.1.1.1

      - INTERNAL_SUBNET=10.10.0.0

    volumes:
      - ./volumes/wireguard:/config:Z
      - /lib/modules:/lib/modules:ro

    ports:
      - 51820:51820/udp

    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1

    restart: unless-stopped

    networks:
      - internal_net

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer

    restart: unless-stopped

    expose:
      - "9000"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./volumes/portainer:/data:Z

    networks:
      - internal_net


  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager

    restart: unless-stopped

    ports:
      - 81:81
      - 80:80
      - 443:443


    expose:
      - "80"
      - "443"

    volumes:
      - ./volumes/nginx/data:/data:Z
      - ./volumes/nginx/letsencrypt:/etc/letsencrypt:Z

    networks:
      - internal_net


networks:
  internal_net:
   external: true
